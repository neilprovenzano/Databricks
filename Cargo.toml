[package]
name = "sessions"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sessions"
path = "main.rs"

[dependencies]
memmap2 = "0.9"
libc = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
